<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Onsae 프로젝트와 동일한 iOS PWA 풀스크린 세팅.
         viewport-fit=cover + apple 메타 + black-translucent 상태바.
         theme-color 는 두지 않음(있으면 iOS가 그 단색을 우선함). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <!-- 플립 숫자 폰트 자체 호스팅 (외부 의존/깜빡임 제거) -->
    <link
      rel="preload"
      href="/fonts/HelveticaCompressed.otf"
      as="font"
      type="font/otf"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/anton.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>COKEEPER</title>
    <script>
      // 모바일(≤699): 가로를 꽉 채워 레터박스 없이 화면을 채움(세로는 스크롤).
      // 넓은 화면(≥700): 전체 디자인 contain(중앙 목업).
      (function () {
        function fit() {
          var vv = window.visualViewport;
          var w = vv ? vv.width : window.innerWidth;
          var s;
          if (w >= 700) {
            var h = vv ? vv.height : window.innerHeight;
            s = Math.min(w / 393, h / 852);
          } else {
            // 모바일: 가로 꽉 채움 + 세로는 '전체 화면 높이'(안전영역 포함)로 →
            // 하단 59pt까지 채워 네비가 최대한 아래로 내려감 (Onsae처럼)
            s = w / 393;
            document.documentElement.style.setProperty("--phone-h", window.innerHeight / s);
          }
          document.documentElement.style.setProperty("--phone-scale", s);
        }
        fit();
        window.addEventListener("resize", fit);
        window.addEventListener("orientationchange", fit);
        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", fit);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
