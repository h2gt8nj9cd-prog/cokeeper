<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <!-- 플립 숫자 폰트 자체 호스팅 (외부 의존/깜빡임 제거) -->
    <link
      rel="preload"
      href="/fonts/HelveticaCompressed.otf"
      as="font"
      type="font/otf"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/anton.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>COKEEPER</title>
    <script>
      // 뷰포트에 맞춰 393x852 프레임 배율(--phone-scale)을 계산.
      //  · 모바일(좁은 화면): 세로를 100% 채워 여백 없이 꽉 차게
      //  · 데스크탑(넓은 화면): 폰을 실물 크기(최대 1x) 안에서 중앙 목업으로
      (function () {
        function fit() {
          var vv = window.visualViewport;
          var w = vv ? vv.width : window.innerWidth;
          var h = vv ? vv.height : window.innerHeight;
          var isDesktop = w >= 700; // 넓은 화면 → 폰 목업
          var s = isDesktop ? Math.min((h - 56) / 852, 1) : h / 852;
          document.documentElement.style.setProperty("--phone-scale", s);
          document.documentElement.classList.toggle("is-desktop", isDesktop);
        }
        fit();
        window.addEventListener("resize", fit);
        window.addEventListener("orientationchange", fit);
        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", fit);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
