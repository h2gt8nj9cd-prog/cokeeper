<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0e0f12" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <!-- 플립 숫자 폰트 자체 호스팅 (외부 의존/깜빡임 제거) -->
    <link
      rel="preload"
      href="/fonts/HelveticaCompressed.otf"
      as="font"
      type="font/otf"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/anton.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>COKEEPER</title>
    <script>
      // 모바일(좁은 화면): 가로를 꽉 채우고(양옆 여백 0) 세로도 화면에 맞게 → 실제 폰 풀스크린.
      // 넓은 화면(태블릿·데스크탑): 전체 디자인을 비율 유지로 중앙 배치(contain) + 다크 레터박스.
      (function () {
        function fit() {
          var vv = window.visualViewport;
          var w = vv ? vv.width : window.innerWidth;
          var h = vv ? vv.height : window.innerHeight;
          var isWide = w >= 700;
          var s;
          if (isWide) {
            s = Math.min(w / 393, h / 852);
          } else {
            s = w / 393;
            document.documentElement.style.setProperty("--phone-h", h / s);
          }
          document.documentElement.style.setProperty("--phone-scale", s);
          document.documentElement.classList.toggle("is-wide", isWide);
        }
        fit();
        window.addEventListener("resize", fit);
        window.addEventListener("orientationchange", fit);
        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", fit);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
