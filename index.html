<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0e0f12" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <!-- 플립 숫자 폰트 자체 호스팅 (외부 의존/깜빡임 제거) -->
    <link
      rel="preload"
      href="/fonts/HelveticaCompressed.otf"
      as="font"
      type="font/otf"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/anton.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>COKEEPER</title>
    <script>
      // 모든 기기 동일: 393x852 전체 디자인을 비율 유지로 화면에 맞춤(contain).
      // = Figma 미러링과 동일하게 디자인 전체를 그대로 보여줌. iPhone 14 Pro 풀스크린이면 1:1.
      (function () {
        function fit() {
          var vv = window.visualViewport;
          var w = vv ? vv.width : window.innerWidth;
          var h = vv ? vv.height : window.innerHeight;
          var s = Math.min(w / 393, h / 852);
          document.documentElement.style.setProperty("--phone-scale", s);
        }
        fit();
        window.addEventListener("resize", fit);
        window.addEventListener("orientationchange", fit);
        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", fit);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
